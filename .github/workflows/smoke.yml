name: Framework smoke tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install matched Chrome and ChromeDriver
        run: python scripts/setup-chrome.py
      - if: runner.os == 'Linux'
        run: sh mvnw -B clean verify
      - if: runner.os == 'Windows'
        run: .\mvnw.cmd -B clean verify
      - name: Check required tests
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          tests = [case for report in Path('target/surefire-reports').glob('TEST-*.xml') for case in ET.parse(report).findall('testcase')]
          passed = {t.get('name') for t in tests if all(t.find(k) is None for k in ('skipped','failure','error'))}
          assert {'guestCartIsIsolated','shopperAddsNotebook','browserCheckoutAndLogout','concurrentCheckouts','isolatedOrdersAndStock','inventoryLimitsPreserveCart','configurationPrecedence','rejectsInvalidConfiguration'} <= passed, passed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports-${{ runner.os }}
          path: target/surefire-reports/

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: shop-browser-preview
          path: target/browser-preview/shop.png
          if-no-files-found: error
