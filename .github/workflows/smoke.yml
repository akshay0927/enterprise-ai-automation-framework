name: Framework smoke tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: runner.os == 'Linux'
        run: sh mvnw -B clean verify
      - if: runner.os == 'Windows'
        run: .\mvnw.cmd -B clean verify
      - name: Check required tests
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          tests = ET.parse('target/surefire-reports/TEST-shop.SmokeTest.xml').findall('testcase')
          passed = {t.get('name') for t in tests if all(t.find(k) is None for k in ('skipped','failure','error'))}
          assert {'guestCartIsIsolated','shopperAddsNotebook'} <= passed, passed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports-${{ runner.os }}
          path: target/surefire-reports/
