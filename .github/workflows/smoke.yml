name: Framework smoke tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install matched Chrome and ChromeDriver on Windows
        if: runner.os == 'Windows'
        run: python scripts/setup-chrome.py
      - if: runner.os == 'Linux'
        run: sh mvnw -B clean verify
      - if: runner.os == 'Windows'
        run: .\mvnw.cmd -B clean verify
      - name: Verify standalone launcher from a path with spaces
        if: runner.os == 'Windows'
        run: |
          python scripts/test-windows-launcher.py start-shop.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-windows-launcher.py start-shop.cmd
      - name: Check required tests
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          tests = [case for report in Path('target/surefire-reports').glob('TEST-*.xml') for case in ET.parse(report).findall('testcase')]
          passed = {t.get('name') for t in tests if all(t.find(k) is None for k in ('skipped','failure','error'))}
          assert {'guestCartIsIsolated','shopperAddsNotebook','browserCheckoutAndLogout','expiredCheckoutReturnsToGuest','cartStartupFailureIsDiagnosed','concurrentCheckouts','isolatedOrdersAndStock','inventoryLimitsPreserveCart','configurationPrecedence','rejectsInvalidConfiguration'} <= passed, passed
          reports = Path('target/surefire-reports/browser-diagnostics').glob('catalog-open-*.txt')
          expected = "documentRequested=true\ndocumentSent=true\nproductsSent=true\ncartSent=false\npageState=error\n"
          assert any(report.read_text(encoding='utf-8') == expected for report in reports), 'Missing cart failure diagnostic'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports-${{ runner.os }}
          path: target/surefire-reports/

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: shop-browser-preview
          path: target/browser-preview/shop.png
          if-no-files-found: error
