name: Framework smoke tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - name: Check required tests
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          tests = ET.parse('target/surefire-reports/TEST-shop.SmokeTest.xml').findall('testcase')
          passed = {t.get('name') for t in tests if all(t.find(k) is None for k in ('skipped','failure','error'))}
          assert {'guestCartIsIsolated','shopperAddsNotebook'} <= passed, passed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports
          path: target/surefire-reports/
